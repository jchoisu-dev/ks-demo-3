# Local run: Redis + scraper. Passwords come from .env.
services:
  redis:
    image: redis:7.4-alpine
    # The scraper's loop runs on expired-key events, so keyspace notifications must be on.
    entrypoint: ["sh", "-c"]
    command:
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --notify-keyspace-events Ex --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  scraper:
    build: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OREGON_API_KEY: ${OREGON_API_KEY}
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  redis-data:
